name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14

      - id: yarn-cache
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Runs a single command using the runners shell
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install deps
        run: forge install

      # This is required separately from yarn test because it generates the typechain definitions
      - name: Compile
        run: yarn compile

      - name: Run unit tests
        run: yarn test
        env: 
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
  test:
    name: Foundry Unit Tests
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out core contracts for integration tests
        uses: actions/checkout@v4
        with:
          repository: icarus-finance/contracts
          ref: ${{ vars.ICARUS_CORE_REF || 'main' }}
          path: .core-contracts
          submodules: recursive
      - uses: actions/setup-node@v4
      - name: Install dev dependencies
        run: yarn install

      # Runs a single command using the runners shell
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install deps
        run: forge install

      - name: Build production core dependencies
        working-directory: .core-contracts
        run: forge build --skip test --skip script

      - name: Run tests
        run: forge test -vvv
        env: 
          ICARUS_CORE_ARTIFACTS: .core-contracts/out
          PRIVATE_KEY_DEPLOY: ${{ secrets.PRIVATE_KEY_DEPLOY }}
