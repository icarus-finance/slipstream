[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.7.6"
optimizer = true
optimizer_runs = 200
evm_version = 'shanghai'

fs_permissions = [
    { access = "read-write", path = "./"},
    { access = "read", path = "../contracts/out" }
]

no_match_test = "testEchidna"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[fuzz]
runs = 5000

[rpc_endpoints]
rise_testnet = "${RISE_TESTNET_RPC_URL}"
rise = "${RISE_RPC_URL}"

[etherscan]
rise_testnet = { key = "", url = "${RISE_TESTNET_ETHERSCAN_VERIFIER_URL}" }
rise = { key = "", url = "${RISE_ETHERSCAN_VERIFIER_URL}" }
